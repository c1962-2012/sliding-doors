# Ogni 5 minuti controlla se il canale YouTube ufficiale dell'AS Roma è in diretta e scrive il risultato sul ramo "stato".
# L'app legge quel file e, se l'utente ha attivato l'avviso, gli chiede se vuole guardare la diretta.
name: Controllo diretta AS Roma

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-roma
  cancel-in-progress: true

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controlla il canale
        run: node tools/live-roma.js live-roma.json
      - name: Scrivi il risultato sul ramo stato
        run: |
          mkdir stato && cp live-roma.json stato/
          cd stato
          git init -q -b stato
          git config user.name "stato-bot"
          git config user.email "stato-bot@users.noreply.github.com"
          git add live-roma.json
          git commit -q -m "Stato diretta AS Roma"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" stato

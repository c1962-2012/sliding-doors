# Aggiorna i dati e pubblica l'app su GitHub Pages: ogni ora (così highlights e interviste arrivano subito dopo ogni partita), a ogni modifica e a mano dalla scheda Actions.
name: Aggiorna e pubblica

on:
  schedule:
    - cron: "20 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # i video già trovati e le partite di coppa già scaricate restano da un aggiornamento all'altro
      - uses: actions/cache@v4
        with:
          path: |
            data-src/youtube.json
            data-src/espn-coppe.json
            data-src/sky.json
          key: dati3-${{ github.run_id }}
          restore-keys: dati3-
      # se una fonte non risponde si pubblicano comunque gli ultimi dati presenti nel repository
      - name: Aggiorna i dati
        run: node tools/update.js
        continue-on-error: true
      - name: Costruisci il sito
        run: node tools/build-site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # a volte GitHub Pages rifiuta il primo invio: si riprova da solo dopo un minuto
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
